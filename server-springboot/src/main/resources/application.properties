# ===================================================================
# MIORA Spring Boot Backend - Production Configuration
# ===================================================================

server.port=${PORT:8080}

# Error Response Sanitization - Suppress internal stack traces and server internals
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Razorpay Test Mode Credentials (Loaded from environment / .env)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Firebase Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:miora-dating-app}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}
firebase.dev-fallback-enabled=${FIREBASE_DEV_FALLBACK_ENABLED:true}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
